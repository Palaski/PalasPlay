name: Build PalasPlay APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake
        run: sdkmanager "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build universal APKs
        env:
          NO_GS: 'true'
        run: >
          ./gradlew
          :fermata:packageAutoReleaseUniversalApk
          :fermata:packageMobileReleaseUniversalApk
          -PABI=arm64-v8a

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: palasplay-apk
          path: fermata/build/outputs/**/*.apk
