name: Build PalasPlay APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (mobile)
        env:
          NO_GS: 'true'
        run: ./gradlew :fermata:assembleMobileRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: palasplay-apk
          path: fermata/build/outputs/apk/**/*.apk
